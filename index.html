<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomed - Recepción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-notes-medical text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Biomed <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full uppercase tracking-wider font-normal">Recepción PWA</span></h1>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span id="offline-badge" class="hidden bg-amber-500 text-white px-2 py-1 rounded text-xs"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Modo Offline</span>
                <span><i class="fa-regular fa-clock mr-1"></i> <span id="current-time"></span></span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex space-x-8">
            <button onclick="switchTab('pacientes')" id="btn-pacientes" class="py-3 px-1 border-b-2 border-indigo-600 font-medium text-sm text-indigo-600 flex items-center space-x-2">
                <i class="fa-solid fa-user-plus"></i><span>Pacientes</span>
            </button>
            <button onclick="switchTab('caja')" id="btn-caja" class="py-3 px-1 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 flex items-center space-x-2">
                <i class="fa-solid fa-cash-register"></i><span>Caja & Facturación</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- TAB: PACIENTES -->
        <section id="tab-pacientes" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Formulario Registro -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-id-card text-indigo-600 mr-2"></i>Nuevo Registro
                    </h2>
                    <form id="patient-form" onsubmit="registerPatient(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nombre Completo</label>
                            <input type="text" id="p-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Cédula / ID</label>
                                <input type="text" id="p-id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Teléfono</label>
                                <input type="tel" id="p-phone" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Servicio Requerido</label>
                            <select id="p-service" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                                <option value="Consulta Ginecoobstetricia">Consulta Ginecoobstetricia</option>
                                <option value="Ecografía">Ecografía</option>
                                <option value="Laboratorio">Laboratorio</option>
                            </select>
                        </div>
                        <div id="gine-fields" class="space-y-4 pt-2 border-t border-slate-100">
                            <label class="block text-xs font-bold uppercase text-indigo-600">Datos Ginecoobstétricos</label>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-[10px] text-slate-400 uppercase">Gestas (G)</label>
                                    <input type="number" id="p-gestas" value="0" min="0" class="w-full px-2 py-1.5 border border-slate-300 rounded text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 uppercase">Partos (P)</label>
                                    <input type="number" id="p-partos" value="0" min="0" class="w-full px-2 py-1.5 border border-slate-300 rounded text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 uppercase">Cesáreas (C)</label>
                                    <input type="number" id="p-cesareas" value="0" min="0" class="w-full px-2 py-1.5 border border-slate-300 rounded text-sm">
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 text-sm shadow-sm">
                            Guardar y Pasar a Caja
                        </button>
                    </form>
                </div>

                <!-- Tabla de Pacientes del Día -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-hospital-user text-indigo-600 mr-2"></i>Pacientes Registrados Hoy</span>
                        <span id="patient-count" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-bold">0 pacientes</span>
                    </h2>
                    <div class="overflow-x-auto flex-grow">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase">
                                    <th class="py-3 px-2">Paciente</th>
                                    <th class="py-3 px-2">ID</th>
                                    <th class="py-3 px-2">Servicio</th>
                                    <th class="py-3 px-2">Estatus</th>
                                    <th class="py-3 px-2 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="patients-table-body" class="text-sm divide-y divide-slate-100">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 italic">No hay pacientes registrados hoy</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB: CAJA -->
        <section id="tab-caja" class="hidden space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Facturación Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-file-invoice-dollar text-emerald-600 mr-2"></i>Emitir Factura / Recibo
                    </h2>
                    <form id="invoice-form" onsubmit="generateInvoice(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Seleccionar Paciente</label>
                            <select id="inv-patient" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                                <option value="">-- Seleccione un paciente pendiente --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Concepto del Servicio</label>
                            <input type="text" id="inv-concept" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Monto ($)</label>
                                <input type="number" step="0.01" id="inv-amount" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Método de Pago</label>
                                <select id="inv-method" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta">Tarjeta</option>
                                    <option value="Pago Móvil / Transferencia">Transferencia</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 text-sm shadow-sm">
                            Procesar Pago & Facturar
                        </button>
                    </form>
                </div>

                <!-- Historial de Facturas / Tickets -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-receipt text-emerald-600 mr-2"></i>Comprobantes Emitidos</span>
                        <span id="invoice-count" class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-bold">0 facturas</span>
                    </h2>
                    <div class="overflow-x-auto flex-grow">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase">
                                    <th class="py-3 px-2"># Recibo</th>
                                    <th class="py-3 px-2">Paciente</th>
                                    <th class="py-3 px-2">Concepto</th>
                                    <th class="py-3 px-2">Monto</th>
                                    <th class="py-3 px-2 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="invoices-table-body" class="text-sm divide-y divide-slate-100">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 italic">No hay cobros procesados hoy</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Script de lógica de la PWA local -->
    <script>
        // Reloj en tiempo real
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Control de pestañas
        function switchTab(tab) {
            document.getElementById('tab-pacientes').classList.add('hidden');
            document.getElementById('tab-caja').classList.add('hidden');
            document.getElementById('btn-pacientes').className = "py-3 px-1 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 flex items-center space-x-2";
            document.getElementById('btn-caja').className = "py-3 px-1 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 flex items-center space-x-2";

            if (tab === 'pacientes') {
                document.getElementById('tab-pacientes').classList.remove('hidden');
                document.getElementById('btn-pacientes').className = "py-3 px-1 border-b-2 border-indigo-600 font-medium text-sm text-indigo-600 flex items-center space-x-2";
            } else {
                document.getElementById('tab-caja').classList.remove('hidden');
                document.getElementById('btn-caja').className = "py-3 px-1 border-b-2 border-emerald-600 font-medium text-sm text-emerald-600 flex items-center space-x-2";
                updateInvoicePatientSelect();
            }
        }

        // Almacenamiento LocalStorage
        let patients = JSON.parse(localStorage.getItem('biomed_patients')) || [];
        let invoices = JSON.parse(localStorage.getItem('biomed_invoices')) || [];

        function saveData() {
            localStorage.setItem('biomed_patients', JSON.stringify(patients));
            localStorage.setItem('biomed_invoices', JSON.stringify(invoices));
            renderTables();
        }

        // Registro de paciente
        function registerPatient(e) {
            e.preventDefault();
            const newPatient = {
                id: 'P-' + Date.now().toString().slice(-4),
                name: document.getElementById('p-name').value,
                docId: document.getElementById('p-id').value,
                phone: document.getElementById('p-phone').value,
                service: document.getElementById('p-service').value,
                gestas: document.getElementById('p-gestas').value,
                partos: document.getElementById('p-partos').value,
                cesareas: document.getElementById('p-cesareas').value,
                status: 'Pendiente de Pago',
                date: new Date().toLocaleDateString()
            };

            patients.unshift(newPatient);
            saveData();
            document.getElementById('patient-form').reset();
            alert('¡Paciente registrado con éxito!');
        }

        // Rellenar selector de pacientes para facturación (solo pendientes)
        function updateInvoicePatientSelect() {
            const select = document.getElementById('inv-patient');
            select.innerHTML = '<option value="">-- Seleccione un paciente pendiente --</option>';
            patients.filter(p => p.status === 'Pendiente de Pago').forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} (${p.service})`;
                select.appendChild(opt);
            });
        }

        // Generar Factura
        function generateInvoice(e) {
            e.preventDefault();
            const patientId = document.getElementById('inv-patient').value;
            const patient = patients.find(p => p.id === patientId);

            if (!patient) return;

            const newInvoice = {
                code: 'FAC-' + Date.now().toString().slice(-4),
                patientName: patient.name,
                concept: document.getElementById('inv-concept').value,
                amount: parseFloat(document.getElementById('inv-amount').value).toFixed(2),
                method: document.getElementById('inv-method').value,
                date: new Date().toLocaleDateString()
            };

            invoices.unshift(newInvoice);
            patient.status = 'Pagado / En Proceso';
            saveData();
            document.getElementById('invoice-form').reset();
            alert('¡Factura emitida correctamente!');
        }

        // Renderizar Tablas
        function renderTables() {
            // Tabla Pacientes
            const pBody = document.getElementById('patients-table-body');
            document.getElementById('patient-count').textContent = `${patients.length} pacientes`;
            if (patients.length === 0) {
                pBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 italic">No hay pacientes registrados hoy</td></tr>`;
            } else {
                pBody.innerHTML = patients.map(p => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 px-2 font-medium text-slate-700">${p.name}<br><span class="text-xs text-slate-400">${p.phone}</span></td>
                        <td class="py-3 px-2 text-slate-600">${p.docId}</td>
                        <td class="py-3 px-2"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs font-medium">${p.service}</span></td>
                        <td class="py-3 px-2">
                            <span class="px-2 py-1 rounded-full text-xs font-semibold ${p.status === 'Pagado / En Proceso' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${p.status}
                            </span>
                        </td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="printTicket('${p.id}')" class="text-indigo-600 hover:text-indigo-800 p-1" title="Imprimir Ticket de Cita"><i class="fa-solid fa-print"></i></button>
                        </td>
                    </tr>
                `).join('');
            }

            // Tabla Facturas
            const iBody = document.getElementById('invoices-table-body');
            document.getElementById('invoice-count').textContent = `${invoices.length} facturas`;
            if (invoices.length === 0) {
                iBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 italic">No hay cobros procesados hoy</td></tr>`;
            } else {
                iBody.innerHTML = invoices.map(i => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 px-2 font-medium text-slate-700">${i.code}</td>
                        <td class="py-3 px-2 text-slate-600">${i.patientName}</td>
                        <td class="py-3 px-2 text-slate-600">${i.concept}</td>
                        <td class="py-3 px-2 font-bold text-emerald-600">$${i.amount}</td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="alert('Imprimiendo recibo ${i.code}...')" class="text-emerald-600 hover:text-emerald-800 p-1" title="Imprimir Recibo Fiscal"><i class="fa-solid fa-file-invoice"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function printTicket(id) {
            const p = patients.find(item => item.id === id);
            if (p) {
                alert(`Imprimiendo ticket de cita para: ${p.name}\nServicio: ${p.service}\nID: ${p.id}`);
            }
        }

        // Control de conectividad Offline/Online
        window.addEventListener('online', () => document.getElementById('offline-badge').classList.add('hidden'));
        window.addEventListener('offline', () => document.getElementById('offline-badge').classList.remove('hidden'));
        if(!navigator.onLine) document.getElementById('offline-badge').classList.remove('hidden');

        // Cargar datos iniciales al abrir
        renderTables();
    </script>
</body>
</html>
